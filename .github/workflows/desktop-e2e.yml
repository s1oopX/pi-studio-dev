name: Desktop E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packages the offline Windows build, then drives the packaged renderer and
  # the compiled backend through a real Electron session against a faux
  # provider (packages/desktop/test/e2e). No provider keys or network beyond
  # 127.0.0.1 are involved.
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips electron's postinstall, so the binary in
      # node_modules/electron/dist never materializes. Run exactly that one
      # vetted script instead of enabling lifecycle scripts globally.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Package offline build
        run: npm run pack:offline -w @s1oopx/pi-studio-dev

      - name: Verify packaged artifact
        shell: pwsh
        run: |
          $exe = "packages/desktop/release/win-unpacked/Pi Studio Dev.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged app: $exe" }
          $backend = "packages/desktop/release/win-unpacked/resources/pi-backend/pi-studio-backend.exe"
          if (-not (Test-Path $backend)) { throw "Missing packaged backend: $backend" }

      - name: Run E2E smoke test
        run: npm run test:e2e -w @s1oopx/pi-studio-dev
        env:
          PI_STUDIO_E2E_EXECUTABLE: ${{ github.workspace }}/packages/desktop/release/win-unpacked/Pi Studio Dev.exe
          PI_STUDIO_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-failure
          path: e2e-artifacts/
          if-no-files-found: ignore
